name: Schutz ECR Pull Test

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Service EC2 instance ID"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2

      - name: Pull FastAPI image on EC2
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          IMAGE_TAG: sha-8f97a8d337fb672c8c6e92bfd22ca49c2ff2dde0-39910776450-1
        run: |
          set -euo pipefail

          python3 - <<'REMOTE'
          import json
          import os

          tag = os.environ["IMAGE_TAG"]
          commands = [
              "set -eu",
              "echo CHECKING_ECR",
              "ACCOUNT=$(aws sts get-caller-identity --query Account --output text)",
              "REGISTRY=${ACCOUNT}.dkr.ecr.ap-northeast-2.amazonaws.com",
              "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin \"$REGISTRY\" >/dev/null",
              f"IMAGE=\"$REGISTRY/schutz/fast-api:{tag}\"",
              "docker pull \"$IMAGE\" >/dev/null",
              "docker image inspect \"$IMAGE\" >/dev/null",
              "echo ECR_PULL_SUCCESS"
          ]
          with open("ssm-params.json", "w") as f:
              json.dump({"commands": commands}, f)
          REMOTE

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Code:ResponseCode}' \
              --output json
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
