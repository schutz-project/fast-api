name: Schutz FastAPI Release Preflight

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Service EC2 instance ID"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2

      - name: Validate FastAPI release configuration
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          import json

          tag = (
              "sha-8f97a8d337fb672c8c6e92bfd22ca49c2ff2dde0"
              "-39910776450-1"
          )

          commands = [
              "set -eu",
              "cd /opt/schutz/employee-portal-p0",
              "test -f compose.yaml",
              "test -f compose.ecr.yaml",
              "OLD_IMAGE=$(docker inspect employee-portal-p0-api-1 --format '{{.Config.Image}}')",
              "echo CURRENT_IMAGE_TAG=${OLD_IMAGE##*:}",
              "ACCOUNT=$(aws sts get-caller-identity --query Account --output text)",
              "REGISTRY=${ACCOUNT}.dkr.ecr.ap-northeast-2.amazonaws.com",
              f"NEW_IMAGE=\"$REGISTRY/schutz/fast-api:{tag}\"",
              "docker image inspect \"$NEW_IMAGE\" >/dev/null",
              "TEMP=$(mktemp /tmp/schutz-release-XXXXXX.yaml)",
              "trap 'rm -f \"$TEMP\"' EXIT",
              "printf 'services:\\n  api:\\n    image: %s\\n' \"$NEW_IMAGE\" > \"$TEMP\"",
              "docker compose -p employee-portal-p0 -f compose.yaml -f compose.ecr.yaml -f \"$TEMP\" config -q",
              "RESOLVED=$(docker compose -p employee-portal-p0 -f compose.yaml -f compose.ecr.yaml -f \"$TEMP\" config --images api)",
              "test \"$RESOLVED\" = \"$NEW_IMAGE\"",
              "echo RELEASE_COMPOSE_OK",
              "echo CONTAINER_UNCHANGED"
          ]

          with open("ssm-params.json", "w") as f:
              json.dump({"commands": commands}, f)
          PYCODE

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Code:ResponseCode}' \
              --output json
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
