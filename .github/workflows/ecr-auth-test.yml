name: Schutz ECR Authentication Test

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "EC2 instance ID"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-ecr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2

      - name: Check ECR authentication on EC2
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["set -eu","aws --version","aws ecr get-login-password --region ap-northeast-2 >/dev/null","echo ECR_AUTH_OK"]}' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          echo "ECR authentication test: $STATUS"
          test "$STATUS" = "Success"
