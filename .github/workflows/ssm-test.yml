name: Schutz SSM Connection Test

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "EC2 instance ID"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-ssm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2

      - name: Send read-only test command
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["echo SCHUTZ_SSM_READY","docker --version","docker compose version"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command submitted"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          echo "Result: $STATUS"
          test "$STATUS" = "Success"
