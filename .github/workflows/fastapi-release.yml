name: Schutz FastAPI Manual Release

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Service EC2 instance ID only"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY to recreate the FastAPI container"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: schutz-fastapi-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2
      - name: Deploy FastAPI via SSM
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
        run: |
          set -euo pipefail
          test -f deploy/fastapi-release.sh
          # Send script without expanding its content into GitHub logs.
          python3 - <<'PYCODE'
          import base64, json
          from pathlib import Path
          encoded = base64.b64encode(Path('deploy/fastapi-release.sh').read_bytes()).decode()
          command = f"echo '{encoded}' | base64 -d | bash"
          Path('ssm-params.json').write_text(json.dumps({'commands': [command]}))
          PYCODE
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' --output text)
          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Code:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' --output json
