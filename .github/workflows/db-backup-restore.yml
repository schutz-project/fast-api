name: Schutz DB Backup Restore Check

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Database to restore in a temporary container"
        required: true
        type: choice
        options:
          - portal
          - management
      confirmation:
        description: "Type RESTORE_TEST"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: schutz-db-restore-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2
      - name: Backup and restore through SSM
        env:
          TARGET: ${{ inputs.target }}
          CONFIRMATION: ${{ inputs.confirmation }}
          INSTANCE_ID: ${{ inputs.target == 'portal' && 'i-09af34fe68b6c200c' || 'i-066c8eee143b5cdff' }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = RESTORE_TEST
          python3 - <<'PY'
          import base64, json, os, re, shlex
          from pathlib import Path
          iid=os.environ['INSTANCE_ID']
          assert iid == {'portal':'i-09af34fe68b6c200c','management':'i-066c8eee143b5cdff'}[os.environ['TARGET']], 'Invalid target'
          args=[os.environ['TARGET']]
          script=Path('scripts/db-restore-check.py').read_bytes()
          b64=base64.b64encode(script).decode()
          cmd='printf %s '+shlex.quote(b64)+' | base64 -d | python3 - '+' '.join(map(shlex.quote,args))
          Path('ssm-params.json').write_text(json.dumps({'commands':['set -eu',cmd], 'executionTimeout':['1200']}))
          PY
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM_COMMAND_ID=$COMMAND_ID"
          export COMMAND_ID
          python3 - <<'PYWAIT'
          import json, os, subprocess, time
          deadline = time.monotonic() + 1260
          while time.monotonic() < deadline:
              p = subprocess.run(
                  ['aws','ssm','get-command-invocation',
                   '--command-id',os.environ['COMMAND_ID'],
                   '--instance-id',os.environ['INSTANCE_ID'],
                   '--output','json','--no-cli-pager'],
                  capture_output=True, text=True, timeout=60)
              if p.returncode:
                  if 'InvocationDoesNotExist' not in p.stderr:
                      raise SystemExit(p.stderr)
              else:
                  data = json.loads(p.stdout)
                  status = data['Status']
                  print('SSM_STATUS=' + status, flush=True)
                  if status not in ('Pending','InProgress','Delayed','Cancelling'):
                      print(data.get('StandardOutputContent',''))
                      print(data.get('StandardErrorContent',''))
                      raise SystemExit(0 if status == 'Success' and data['ResponseCode'] == 0 and 'DB_BACKUP_RESTORE_SUCCESS' in data.get('StandardOutputContent','').splitlines() else 1)
              time.sleep(10)
          raise SystemExit('SSM_RESULT_TIMEOUT: inspect ' + os.environ['COMMAND_ID'] + ' before retrying')
          PYWAIT
