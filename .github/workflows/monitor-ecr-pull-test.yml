name: Schutz Monitor ECR Pull Test

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Monitoring EC2 instance ID"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-monitor-pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2

      - name: Pull monitoring images
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          import json

          commands = [
              "set -eu",
              "ACCOUNT=$(aws sts get-caller-identity --query Account --output text)",
              "REGISTRY=${ACCOUNT}.dkr.ecr.ap-northeast-2.amazonaws.com",
              "export DOCKER_CONFIG=$(mktemp -d)",
              "trap 'rm -rf \"$DOCKER_CONFIG\"' EXIT",
              "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin \"$REGISTRY\" >/dev/null",
              "docker pull \"$REGISTRY/schutz/management-worker:sha-a4cb6f75b9c4d47ae1fbb9587495c9b3469aeb7b-39897326854-1\" >/dev/null",
              "echo WORKER_PULL_OK",
              "docker pull \"$REGISTRY/schutz/management-web:sha-42a383810c16731985180190d7f9430074a7cdb9-39897334971-1\" >/dev/null",
              "echo WEB_PULL_OK",
              "echo MONITOR_ECR_PULL_SUCCESS"
          ]

          with open("ssm-params.json", "w") as f:
              json.dump({"commands": commands}, f)
          PYCODE

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Code:ResponseCode,Output:StandardOutputContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text)

          test "$STATUS" = "Success"
