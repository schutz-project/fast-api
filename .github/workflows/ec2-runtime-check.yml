name: Schutz EC2 Runtime Check

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Target EC2 instance ID"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2

      - name: Inspect remote Docker runtime
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          import json
          commands = [
              "set -eu",
              "echo === HOSTNAME ===",
              "hostname",
              "echo === COMPOSE PROJECTS ===",
              "docker compose ls --format json",
              "echo === RUNNING CONTAINERS ===",
              "docker ps --format '{{.Names}} | {{.Image}} | {{.Status}}'",
              "echo === CHECK COMPLETE ==="
          ]
          with open("ssm-params.json", "w") as f:
              json.dump({"commands": commands}, f)
          PYCODE

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
